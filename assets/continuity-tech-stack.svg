<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Continuity — Code & Technology Stack</title>
  <desc id="desc">A premium visual showing Continuity's source languages and technology stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFC"/><stop offset="0.52" stop-color="#EEF6F5"/><stop offset="1" stop-color="#F2EEFF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#334155" flood-opacity=".12"/></filter>
  </defs>

  <rect x="14" y="14" width="1572" height="672" rx="34" fill="url(#bg)"/>
  <rect x="14" y="14" width="1572" height="672" rx="34" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <text x="70" y="72" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#1E293B">Continuity</text>
  <text x="70" y="108" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.5" fill="#0F766E">CODE &amp; TECHNOLOGY STACK</text>
  <text x="70" y="138" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B">A compact view of the technologies powering the financial continuity workspace.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="178" width="680" height="440" rx="26" fill="#FFFFFF" fill-opacity=".92"/>
    <rect x="782" y="178" width="748" height="440" rx="26" fill="#FFFFFF" fill-opacity=".92"/>
  </g>

  <text x="108" y="226" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#1E293B">Repository language view</text>
  <text x="108" y="254" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">GitHub Linguist classifies source by language; this panel intentionally avoids hard-coded percentages.</text>

  <g transform="translate(108 292)">
    <circle cx="18" cy="18" r="8" fill="#F7DF1E"/>
    <text x="42" y="24" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">JavaScript / JSX</text>
    <rect x="235" y="7" width="340" height="22" rx="11" fill="#E2E8F0"/>
    <rect x="235" y="7" width="285" height="22" rx="11" fill="url(#accent)"/>
    <text x="595" y="24" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0F766E">Core UI + application logic</text>

    <circle cx="18" cy="78" r="8" fill="#264DE4"/>
    <text x="42" y="84" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">CSS</text>
    <rect x="235" y="67" width="340" height="22" rx="11" fill="#E2E8F0"/>
    <rect x="235" y="67" width="150" height="22" rx="11" fill="#2563EB"/>
    <text x="595" y="84" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB">Design system + responsive UI</text>

    <circle cx="18" cy="138" r="8" fill="#E34F26"/>
    <text x="42" y="144" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">HTML</text>
    <rect x="235" y="127" width="340" height="22" rx="11" fill="#E2E8F0"/>
    <rect x="235" y="127" width="72" height="22" rx="11" fill="#7C3AED"/>
    <text x="595" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7C3AED">Application shell + metadata</text>

    <text x="0" y="216" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">Visual scale is illustrative; use GitHub's current repository language stats for exact percentages.</text>
  </g>

  <text x="820" y="226" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750" fill="#1E293B">Technology stack</text>
  <text x="820" y="254" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">Verified against the project configuration and source structure.</text>

  <g transform="translate(820 286)">
    <g>
      <rect width="202" height="82" rx="18" fill="#F0F9FF"/>
      <text x="18" y="34" font-size="26">⚛</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">React 18</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">UI architecture</text>
    </g>
    <g transform="translate(220 0)">
      <rect width="202" height="82" rx="18" fill="#EEF2FF"/>
      <text x="18" y="34" font-size="26">⚡</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">Vite 5</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Build tooling</text>
    </g>
    <g transform="translate(440 0)">
      <rect width="202" height="82" rx="18" fill="#ECFDF5"/>
      <text x="18" y="34" font-size="26">▣</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">Supabase</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Auth + backend</text>
    </g>

    <g transform="translate(0 104)">
      <rect width="202" height="82" rx="18" fill="#F5F3FF"/>
      <text x="18" y="34" font-size="26">⌘</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">Context API</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Shared app state</text>
    </g>
    <g transform="translate(220 104)">
      <rect width="202" height="82" rx="18" fill="#F0FDFA"/>
      <text x="18" y="34" font-size="26">↯</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">JSX + CSS</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Product interface</text>
    </g>
    <g transform="translate(440 104)">
      <rect width="202" height="82" rx="18" fill="#FFF7ED"/>
      <text x="18" y="34" font-size="26">⚙</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">GitHub Actions</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">CI/CD automation</text>
    </g>

    <g transform="translate(0 208)">
      <rect width="202" height="82" rx="18" fill="#F8FAFC"/>
      <text x="18" y="34" font-size="26">▣</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">Git</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Version control</text>
    </g>
    <g transform="translate(220 208)">
      <rect width="202" height="82" rx="18" fill="#F8FAFC"/>
      <text x="18" y="34" font-size="26">◉</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">GitHub Pages</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Hosting</text>
    </g>
    <g transform="translate(440 208)">
      <rect width="202" height="82" rx="18" fill="#FAF5FF"/>
      <text x="18" y="34" font-size="26">⌕</text><text x="58" y="32" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#0F172A">Command + Search</text><text x="58" y="56" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B">Product navigation</text>
    </g>
  </g>

  <rect x="108" y="554" width="1390" height="1" fill="#E2E8F0"/>
  <text x="108" y="587" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B">Stack focus: product UX · continuity intelligence · secure account flows · deployable frontend architecture</text>
  <text x="108" y="612" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">Continuity currently uses React 18, Vite 5 and Supabase in its checked-in project configuration.</text>
</svg>