<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Continuity — minimal product and technology overview</title><desc id="desc">Light, human-designed overview inspired by the actual Continuity interface, showing navigation, continuity health, key workspace metrics, next best actions, obligations and technology stack.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFB"/><stop offset="0.65" stop-color="#F3F7F5"/><stop offset="1" stop-color="#F2F0FB"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B4332"/><stop offset="1" stop-color="#40916C"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#334155" flood-opacity=".11"/></filter><style>.u{font-family:Inter,Arial,sans-serif}.t{fill:#1F2937}.m{fill:#6B7280}.k{fill:#2D6A4F}</style></defs><rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="68" y="66" class="u k" font-size="17" font-weight="800" letter-spacing="3">CONTINUITY · PRODUCT OVERVIEW</text><text x="68" y="112" class="u t" font-size="43" font-weight="800">Plan Today. Protect Tomorrow.</text><text x="68" y="145" class="u m" font-size="17">A focused workspace for financial continuity, trusted access, documents and readiness.</text><rect x="68" y="184" width="1464" height="615" rx="28" fill="#FFFFFF" filter="url(#shadow)"/><rect x="68" y="184" width="238" height="615" rx="28" fill="#FBFCFB"/><line x1="306" y1="184" x2="306" y2="799" stroke="#E5E7EB"/><g class="u"><text x="103" y="232" class="t" font-size="19" font-weight="800">Continuity</text><text x="103" y="252" class="m" font-size="11">Financial Continuity</text><rect x="91" y="276" width="192" height="36" rx="10" fill="#E8F2ED"/><text x="115" y="300" class="k" font-size="13" font-weight="800">Dashboard</text><t