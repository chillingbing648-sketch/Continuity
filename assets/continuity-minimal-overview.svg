ight="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><text x="368" y="480" font-size="11" font-weight="800" fill="#7B887F">FINANCIAL INVENTORY</text><text x="368" y="515" class="t" font-size="26" font-weight="800">12</text><text x="414" y="515" class="m" font-size="12">assets tracked</text><rect x="634" y="454" width="275" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><text x="658" y="480" font-size="11" font-weight="800" fill="#7B887F">TRUSTED NETWORK</text><text x="658" y="515" class="t" font-size="26" font-weight="800">3</text><text x="704" y="515" class="m" font-size="12">people connected</text><rect x="924" y="454" width="275" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><text x="948" y="480" font-size="11" font-weight="800" fill="#7B887F">DOCUMENT VAULT</text><text x="948" y="515" class="t" font-size="26" font-weight="800">18</text><text x="994" y="515" class="m" font-size="12">files organized</text><rect x="1214" y="454" width="290" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/><text x="1238" y="480" font-size="11" font-weight="800" fill="#7B887F">CONTINUITY PROTOCOL</text><text x="1238" y="515" class="t" font-size="26" font-weight="800">Active</text><text x="1238" y="533" class="m" font-size="11">30-day check-in</text><rect x="344" y="566" width="558" height="188" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="370" y="599" class="k" font-size="11" font-weight="800" letter-spacing="1.6">NEXT BEST ACTIONS</text><text x="370" y="625" class="t" font-size="19" font-weight="800">Fix what matters most.</text><circle cx="382" cy="665" r="9" fill="#FFE8E4"/><text x="379" y="669" font-size="12" font-weight="800" fill="#B94B43">!</text><text x="403" y="664" class="t" font-size="13" font-weight="700">Add nominee to savings account</text><text x="403" y="683" class="m" font-size="11">Critical · protection gap</text><text x="860" y="674" text-anchor="end" class="k" font-size="11" font-weight="800">Assign →</text><circle cx="382" cy="716" r="9" fill="#FFF3DA"/><text x="379" y="720" font-size="12" font-weight="800" fill="#A56A18">•</text><text x="403" y="715" class="t" font-size="13" font-weight="700">Upload property ownership proof</text><text x="403" y="734" class="m" font-size="11">Warning · document gap</text><text x="860" y="725" text-anchor="end" class="k" font-size="11" font-weight="800">Upload →</text><rect x="926" y="566" width="578" height="188" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="952" y="599" class="k" font-size="11" font-weight="800" letter-spacing="1.6">TIME-SENSITIVE</text><text x="952" y="625" class="t" font-size="19" font-weight="800">Upcoming obligations</text><rect x="952" y="648" width="72" height="36" rx="10" fill="#FDEEEE"/><text x="988" y="671" text-anchor="middle" font-size="12" font-weight="800" fill="#B94B43">3 days</text><text x="1040" y="665" class="t" font-size="13" font-weight="700">Insurance premium</text><text x="1040" y="682" class="m" font-size="11">Monthly · Auto-Debit</text><text x="1470" y="670" text-anchor="end" class="t" font-size="13" font-weight="800">₹8,400</text><rect x="952" y="700" width="72" height="36" rx="10" fill="#EEF5F0"/><text x="988" y="723" text-anchor="middle" font-size="12" font-weight="800" fill="#2D6A4F">18 days</text><text x="1040" y="717" class="t" font-size="13" font-weight="700">Home loan EMI</text><text x="1040" y="734" class="m" font-size="11">Monthly · Linked account</text><text x="1470" y="722" text-anchor="end" class="t" font-size="13" font-weight="800">₹21,000</text></g><rect x="68" y="820" width="1464" height="50" rx="15" fill="#EAF2ED"/><g class="u"><text x="94" y="851" class="k" font-size="12" font-weight="800">STACK</text><text x="146" y="851" class="t" font-size="12">React 18</text><circle cx="226" cy="847" r="2.5" fill="#9BAAA1"/><text x="246" y="851" class="t" font-size="12">Vite 5</text><circle cx="318" cy="847" r="2.5" fill="#9BAAA1"/><text x="338" y="851" class="t" font-size="12">JavaScript / JSX</text><circle cx="473" cy=